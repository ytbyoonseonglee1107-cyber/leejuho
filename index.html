<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>이주호 공격하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 어두운 복싱 체육관, 과장된 코믹 액션
   IDEA: 안 죽는 dummy를 주먹·총·레이저·번개·미사일로 괴롭히기
   PICTURE: 1인칭 글러브/총 + 흐느적거리는 dummy가 화면 전체
   COLOUR and TYPE: 콘크리트 회색, 고무 매트, 글러브 빨강 / Black Han Sans + Noto Sans KR
   LAYOUT: 화면 전체 캔버스, 버튼은 아래쪽 반투명 칩 */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#0b0c0e;color:#f1f1f1;font:14px/1.4 "Noto Sans KR",system-ui,sans-serif;display:grid;place-items:center;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage{position:relative;width:min(100vw,177.78dvh);aspect-ratio:16/9}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:2%;display:flex;gap:5px;flex-wrap:nowrap;max-width:98%}
.ctl.moves{bottom:calc(2% + 38px)}
.ctl button{font:inherit;font-weight:500;font-size:13px;height:32px;padding:0 11px;border:1px solid rgba(255,255,255,.14);border-radius:999px;color:#e8e8ea;background:rgba(12,13,16,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ctl button small{font-size:11px;opacity:.6}
.ctl button.on{background:rgba(245,245,247,.92);color:#111;border-color:transparent}
.ctl button:active{transform:scale(.96)}
.ctl button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ctl button.lock{display:none}
@media(max-width:640px){.ctl button{font-size:11px;height:26px;padding:0 7px}.ctl.moves{bottom:calc(2% + 30px)}}
.shop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:5;padding:12px}
.shop[hidden]{display:none}
.box{background:#1b1c1f;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;width:min(460px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.box h2{margin:0 0 2px;font:26px "Black Han Sans",sans-serif}
.box .coin{color:#f2c04b;font-weight:700;margin:0 0 12px}
.item{display:flex;align-items:center;gap:12px;background:#25262a;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item div{flex:1}.item b{font-size:16px}.item small{display:block;opacity:.65;font-size:12px}
.box button{font:inherit;font-weight:700;border:0;border-radius:10px;min-height:40px;padding:4px 12px;cursor:pointer;background:#f2c04b;color:#1a1200;white-space:nowrap}
.box button:disabled{background:#3a3b3f;color:#8a8a8f;cursor:default}
.box .close{width:100%;background:#323338;color:#fff;margin-top:4px}
</style>
</head>
<body>
<div class="stage">
<canvas id="c" width="960" height="540" aria-label="이주호 공격하기 화면"></canvas>
<div class="ctl moves" id="moves">
  <button data-m="jab">잽(J)</button>
  <button data-m="straight">스트레이트(K)</button>
  <button data-m="hook">훅(H)</button>
  <button data-m="upper">어퍼컷(U)</button>
  <button data-m="body">바디블로(B)</button>
</div>
<div class="ctl" id="wpn">
  <button data-w="fist" class="on">주먹(1)</button>
  <button data-w="gun">권총(2)<small id="s-gun"></small></button>
  <button data-w="shotgun">샷건(3)<small id="s-shotgun"></small></button>
  <button data-w="smg">기관총(4)<small id="s-smg"></small></button>
  <button data-w="laser">레이저(5)<small id="s-laser"></small></button>
  <button data-w="tesla">테슬라(6)<small id="s-tesla"></small></button>
  <button data-w="missile">미사일(7)<small id="s-missile"></small></button>
  <button data-w="nuke">핵(8)<small id="s-nuke"></small></button>
  <button id="snd">소리 켬</button>
</div>
</div>
<div class="shop" id="shop" hidden><div class="box" role="dialog" aria-label="상점">
  <h2>상점</h2><p class="coin" id="shopcoins"></p><div id="items"></div>
  <button class="close" id="shopclose">닫기</button>
</div></div>
<script>
{
/* ===== 설정 (여기 숫자만 바꾸면 돼요) ===== */
const DUMMY_NAME='Juho LEE';  // 캐릭터 이름
const COIN_RATE=.02;       // 주먹 코인 = 데미지 × 이 값
const GUN_COIN=3;          // 총·레이저·테슬라는 주먹의 몇 배 코인
const KETCHUP_HITS=20;     // 총알이 이만큼 박힌 뒤에 넘어질 때만 케첩
const HEAL_DELAY=5;        // 안 때리면 몇 초 뒤 원래 모습으로
const RESPAWN=2.5;         // 미사일로 죽은 뒤 부활(초, 조각 흩어지는 1.2초 별도)
const OVERHEAT=3;          // 과열되면 몇 초간 사용 금지
const STAGGER=300;         // 이만큼 누적 데미지면 넘어짐 (다리는 1.7배로 쌓임)
const UP_DMG=.2;           // 강화 1레벨당 데미지 +20%
const MISSILE_CD=90,MISSILE_CD_STEP=12; // 미사일 쿨타임, 강화 1레벨당 감소
const SKIN='#f0c49a',SHIRT='#2e8b7a',PANTS='#2b3a5c',HAIR='#2a1d14';
const SHOP={ // 구매가 / 강화 기본가(레벨마다 배수)
  gun:{name:'권총',buy:30,up:20,max:5,desc:'머리 맞으면 바로 넘어짐'},
  shotgun:{name:'샷건',buy:60,up:35,max:5,desc:'산탄 8발 · 한 방에 넘어뜨림'},
  smg:{name:'기관총',buy:100,up:50,max:5,desc:'누르고 있으면 연사'},
  laser:{name:'레이저',buy:150,up:70,max:5,desc:'누르는 동안 계속 지짐'},
  tesla:{name:'테슬라건',buy:200,up:90,max:5,desc:'번개가 몸 여러 곳으로 튐'},
  missile:{name:'미사일',buy:300,up:120,max:5,desc:'맞으면 레고처럼 분해'},
  nuke:{name:'핵미사일',buy:50000,up:0,max:1,desc:'하늘에서 떨어져 화면 전체가 날아감'}
};
const GUNS={ // pow: 한 발 데미지, cd: 발사 간격, heat: 한 발당 열, cool: 초당 식는 양, imp: 밀어내는 힘
  gun:{cd:.3,pow:[45,55],heat:.1,cool:.12,imp:1,ang:.03,push:.04,len:112},
  shotgun:{cd:.9,pow:[22,28],pellets:8,heat:.25,cool:.12,imp:.35,ang:.02,push:.03,len:170},
  smg:{cd:.08,pow:[20,26],auto:1,heat:.03,cool:.12,imp:.45,ang:.012,push:.015,len:150},
  laser:{cd:.05,pow:[18,22],auto:1,heat:.02,cool:.12,imp:.18,ang:.004,push:.004,len:150},
  tesla:{cd:.5,pow:[70,90],heat:.2,cool:.12,imp:.5,ang:.02,push:.02,len:130},
  missile:{cd:0,len:175},
  nuke:{cd:0,len:190}
};
const ORDER=['gun','shotgun','smg','laser','tesla','missile','nuke'];
const NUKE_CD=120; // 핵 쿨타임(초)
const MOVES={ // out/back: 실제 선수 기준 뻗는·돌아오는 시간(초)
  jab:{out:.11,back:.10,hand:'L',tx:-12,ty:-300,pow:[16,26],ang:.035,push:.05},
  straight:{out:.15,back:.14,hand:'R',tx:8,ty:-298,pow:[30,44],ang:-.045,push:.11},
  hook:{out:.19,back:.17,hand:'L',tx:-38,ty:-296,pow:[36,52],ang:.16,push:.03,curve:-170},
  upper:{out:.19,back:.17,hand:'R',tx:4,ty:-258,pow:[40,58],ang:-.02,push:.03,lift:-230,rise:1},
  body:{out:.17,back:.15,hand:'L',tx:-22,ty:-175,pow:[26,40],ang:.06,push:.08}
};

const cv=document.getElementById('c'),mainCtx=cv.getContext('2d');let ctx=mainCtx;
const W=960,H=540,PY=510,HOME=480;
const REST={L:{x:290,y:530},R:{x:670,y:530}},BASE={x:830,y:565};
let BX=HOME,a=0,va=0,sq=0,vsq=0,lift=0,vl=0,rest=0,upAt=-9,stag=0,rag=null;
let parts=[],rings=[],fx=[],missiles=[],tracers=[],marks=[],splats=[],pieces=[],beam=null,bubble=null,shake=0;
let hurtT=0,dizzyT=0,zapT=0,lastHit=-99,now=0,combo=0,queued=null,markA=1,lastPopT=0,lastScorchT=0;
let weapon='fist',cd=0,recoil=0,flash=0,firing=false,aim={x:480,y:220};
let dead=false,deadT=0,deathAt=0,sound=true,restartArm=0,lastCDs=-1,lastHeatMsg=0;
let coins=0,coinAcc=0,lv={},missileCD=0,nukeCD=0,nukes=[],whiteA=0,quakeT=0;let HEAT=0,OVER=0; // 과열은 모든 총이 같이 씀
for(const k of ORDER)lv[k]=0;
try{localStorage.removeItem('dummy-save2')}catch(e){}
function save(){} // 저장 안 함: 새로고침하면 코인·무기 처음부터
const rnd=(lo,hi)=>lo+Math.random()*(hi-lo);
const dmgMul=w=>1+(lv[w]-1)*UP_DMG;
const missileCdMax=()=>MISSILE_CD-(Math.max(1,lv.missile)-1)*MISSILE_CD_STEP;

/* ---- standing geometry ---- */
function toLocal(x,y){const dx=x-BX,dy=y-PY,c=Math.cos(a),s=Math.sin(a);return{x:dx*c+dy*s,y:-dx*s+dy*c+80}}
function toScreen(p,ang=a){const c=Math.cos(ang),s=Math.sin(ang),sc=1-sq*.6;const lx=p.x*sc,ly=p.y*sc+(p.y<-240?lift:0)-80;return{x:BX+lx*c-ly*s,y:PY+lx*s+ly*c}}
let SW=0;
const armRot=d=>-d*.15+SW;
function segD(px,py,A,B){const dx=B.x-A.x,dy=B.y-A.y,l=dx*dx+dy*dy||1;let t=((px-A.x)*dx+(py-A.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-A.x-dx*t,py-A.y-dy*t)}
function zoneOf(p){
  const hx=p.x/48,hy=(p.y+300)/58;
  if(hx*hx+hy*hy<=1.1)return'head';
  for(const d of[-1,1]){const r=armRot(d),S={x:d*82,y:-228},E={x:S.x-Math.sin(r)*118,y:S.y+Math.cos(r)*118};if(segD(p.x,p.y,S,E)<17)return d<0?'armL':'armR'}
  if(p.y>-250&&p.y<-95){const w=85-(p.y+235)/135*32;if(Math.abs(p.x)<w+6)return'body'}
  if(p.y>=-100&&p.y<=90&&Math.abs(p.x)<=48)return p.x<0?'legL':'legR';
  return null;
}

/* ---- ragdoll (넘어지면 흐느적거리며 굴러다님) ---- */
const RP={head:[0,-300,52],neck:[0,-246,18],pelvis:[0,-104,30],handL:[-82,-114,14],handR:[82,-114,14],footL:[-28,80,12],footR:[28,80,12]};
const STICKS=[['head','neck'],['neck','pelvis'],['neck','handL'],['neck','handR'],['pelvis','footL'],['pelvis','footR'],['head','pelvis']].map(([p,q])=>[p,q,Math.hypot(RP[p][0]-RP[q][0],RP[p][1]-RP[q][1])]);
function knockdown(pt,ix,iy){
  rag={calm:0,p:{}};
  for(const k in RP){const L={x:RP[k][0],y:RP[k][1]},s=toScreen(L),s0=toScreen(L,a-va/60);rag.p[k]={x:s.x,y:s.y,px:s0.x,py:s0.y,r:RP[k][2]}}
  push(pt,ix,iy);hurtT=.5;stag=0;shake=Math.max(shake,18);thump(90,1);
  for(const k in rag.p)rag.p[k].lt=0;
}
function push(pt,ix,iy){
  if(!rag||!rag.p[pt])return;
  const P=rag.p[pt];P.px-=ix;P.py-=iy;
  for(const [p,q] of STICKS){const o=p===pt?q:q===pt?p:null;if(o){rag.p[o].px-=ix*.35;rag.p[o].py-=iy*.35}}
}
function ragStep(dt){
  const G=1900*dt*dt,ps=Object.values(rag.p);
  for(const P of ps){let vx=(P.x-P.px)*.992,vy=(P.y-P.py)*.992;const v=Math.hypot(vx,vy);if(v>40){vx*=40/v;vy*=40/v}P.px=P.x;P.py=P.y;P.x+=vx;P.y+=vy+G;
    if(P.y>PY-P.r&&vy>5&&now-(P.lt||0)>.18){P.lt=now;land(P.x,vy,P.r)}}
  for(let it=0;it<8;it++){
    for(const [p,q,L] of STICKS){const A=rag.p[p],B=rag.p[q],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,f=(d-L)/d*.5;A.x+=dx*f;A.y+=dy*f;B.x-=dx*f;B.y-=dy*f}
    for(const P of ps){if(P.y>PY-P.r)P.y=PY-P.r;const m=30+P.r*.5;if(P.x<m)P.x=m;if(P.x>W-m)P.x=W-m}
  }
  for(const P of ps)if(P.y>=PY-P.r-.5)P.px=P.x-(P.x-P.px)*.88;
  const mv=Math.max(...ps.map(P=>Math.hypot(P.x-P.px,P.y-P.py)));
  if(mv<1.2&&now-lastHit>.8)rag.calm+=dt;else rag.calm=0;
  if(rag.calm>.9||now-lastHit>6)standUp();
}
function land(x,v,r){ // 바닥에 쿵
  const k=Math.min(1,v/25);shake=Math.max(shake,4+k*12);if(r>20)thump(40+k*60,1);
  for(let i=0;i<6+k*10;i++)fx.push({k:'dust',x:x+rnd(-r,r),y:PY-2,vx:rnd(-160,160)*k,vy:rnd(-90,-20)*k,g:200,r:rnd(5,10)+r*.2,t:0,life:rnd(.35,.6)});
}
function standUp(){
  const P=rag.p,fx0=(P.footL.x+P.footR.x)/2,fy0=(P.footL.y+P.footR.y)/2;
  BX=Math.max(170,Math.min(790,fx0));
  a=Math.max(-1.5,Math.min(1.5,Math.atan2(P.neck.x-fx0,-(P.neck.y-fy0))));
  va=0;rest=0;upAt=now;rag=null;stag=0;healNow=true; // 일어나면 자국 전부 지움
}
function xf(A,B,P,Q){return{P,A,t:Math.atan2(Q.y-P.y,Q.x-P.x)-Math.atan2(B[1]-A[1],B[0]-A[0])}}
function ap(X,L){const c=Math.cos(X.t),s=Math.sin(X.t),dx=L[0]-X.A[0],dy=L[1]-X.A[1];return{x:X.P.x+dx*c-dy*s,y:X.P.y+dx*s+dy*c}}
function inv(X,x,y){const c=Math.cos(-X.t),s=Math.sin(-X.t),dx=x-X.P.x,dy=y-X.P.y;return{x:X.A[0]+dx*c-dy*s,y:X.A[1]+dx*s+dy*c}}
function ragXf(){
  const P=rag.p,T=xf([0,-246],[0,-104],P.neck,P.pelvis),o={torso:T,head:xf([0,-246],[0,-300],P.neck,P.head)};
  for(const d of[-1,1]){const s=d<0?'L':'R';
    o['arm'+s]=xf([d*82,-228],[d*82,-114],ap(T,[d*82,-228]),P['hand'+s]);
    o['leg'+s]=xf([d*25,-108],[d*28,80],ap(T,[d*25,-108]),P['foot'+s])}
  return o;
}

/* ---- 맞은 곳 찾기: z = head/body/armL/armR/legL/legR ---- */
const PT={head:'head',body:'neck',armL:'handL',armR:'handR',legL:'footL',legR:'footR'};
const PART={head:'head',body:'torso',armL:'armL',armR:'armR',legL:'legL',legR:'legR'};
function hitTest(x,y){
  if(dead)return null;
  if(rag){
    const X=ragXf(),P=rag.p;
    if(Math.hypot(x-P.head.x,y-P.head.y)<54)return{z:'head',loc:inv(X.head,x,y),pt:'head'};
    for(const s of['L','R']){const sh=ap(X.torso,[s==='L'?-82:82,-228]);if(segD(x,y,sh,P['hand'+s])<20)return{z:'arm'+s,loc:inv(X['arm'+s],x,y),pt:'hand'+s}}
    if(segD(x,y,P.neck,P.pelvis)<62)return{z:'body',loc:inv(X.torso,x,y),pt:Math.hypot(x-P.neck.x,y-P.neck.y)<Math.hypot(x-P.pelvis.x,y-P.pelvis.y)?'neck':'pelvis'};
    for(const s of['L','R']){const hp=ap(X.torso,[s==='L'?-25:25,-108]);if(segD(x,y,hp,P['foot'+s])<24)return{z:'leg'+s,loc:inv(X['leg'+s],x,y),pt:'foot'+s}}
    return null;
  }
  const p=toLocal(x,y),z=zoneOf(p);
  if(!z)return null;
  return{z,loc:p,pt:z==='body'&&p.y>-175?'pelvis':PT[z]};
}

/* ---- audio ---- */
let ac=null,hum=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
const snd=()=>sound&&ac;
const NB={};
function nz(dur,type,freq,vol,shape){
  const t=ac.currentTime,n=ac.createBufferSource(),key=dur+(shape||'');let b=NB[key];
  if(!b){b=NB[key]=ac.createBuffer(1,Math.max(1,ac.sampleRate*dur|0),ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++){const k=i/d.length;d[i]=(Math.random()*2-1)*(shape==='swell'?Math.sin(Math.PI*k):(1-k)*(1-k))}}
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();g.gain.value=vol;
  n.buffer=b;n.connect(f).connect(g).connect(ac.destination);n.start(t);
}
function tone(f0,f1,dur,vol,type){
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function thump(p,body){if(snd()){tone(body?110:150,45,.18,.2+p/150);nz(.06,'lowpass',900,.25+p/200)}}
function whoosh(){if(snd())nz(.08,'bandpass',1800,.05,'swell')}
function bang(v){if(snd()){nz(.1,'highpass',900,.35*v);tone(190,60,.09,.25*v)}}
function launch(){if(snd())nz(.35,'bandpass',700,.3,'swell')}
function boom(){if(snd()){nz(.8,'lowpass',380,.9);tone(85,28,.6,.6)}}
function zapS(){if(snd()){nz(.18,'highpass',2500,.3);tone(900,140,.16,.08,'square')}}
function hissS(){if(snd())nz(.4,'highpass',3000,.15,'swell')}
function humOn(){if(!snd()||hum)return;const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=220;o2.type='square';o2.frequency.value=226;g.gain.value=.035;o.connect(g);o2.connect(g);g.connect(ac.destination);o.start();o2.start();hum={o,o2}}
function humOff(){if(!hum)return;try{hum.o.stop();hum.o2.stop()}catch(e){}hum=null}

/* ---- weapons ---- */
function wake(){audio()}
function setWeapon(w){
  if(w!=='fist'&&!lv[w]){openShop();return}
  weapon=w;firing=false;queued=null;
  for(const k in gl){gl[k].state='idle';gl[k].t=0}
  document.querySelectorAll('#wpn [data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===w));
  document.getElementById('moves').style.display=w==='fist'?'flex':'none';
}
const gl={L:{hand:'L',state:'idle',t:0},R:{hand:'R',state:'idle',t:0}};
const busy=()=>gl.L.state!=='idle'||gl.R.state!=='idle';
function punch(name,tgt,hand,sp){
  wake();if(weapon!=='fist')setWeapon('fist');
  if(busy()){queued={name,tgt,hand,sp};return} // 한 번에 한 기술만

  {const fast=healNow||now-lastHit>HEAL_DELAY;for(const q of shades)q.a-=dt*(fast?.6:.01);shades=shades.filter(q=>q.a>0);if(!shades.length)healNow=false}

    else if(p.k==='brick'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*8);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.7,p.r*2,p.r*1.4);ctx.fillRect(-p.r*.6,-p.r*1.1,p.r*.5,p.r*.5);ctx.fillRect(p.r*.1,-p.r*1.1,p.r*.5,p.r*.5);ctx.restore()}
    else if(p.k==='cloud'){const c=k<.15?'255,190,90':k<.4?'200,110,60':'110,100,95';ctx.fillStyle='rgba('+c+','+(.75*(1-k))+')';ell(p.x,p.y,p.r*(1+k*.8),p.r*(1+k*.8))}
    else if(p.k==='dust'){ctx.fillStyle='rgba(170,165,155,'+(.4*(1-k))+')';ell(p.x,p.y,p.r*(1+k*1.6),p.r*(1+k*1.6)*.6)}
    else if(p.k==='drop'){ctx.fillStyle='#d8142a';ell(p.x,p.y,p.r,p.r*1.3)}
    else if(p.k==='bolt'){ctx.lineJoin='round';for(const [lw,c] of [[p.w*3.5,'rgba(110,190,255,'+(.4*(1-k))+')'],[p.w,'rgba(235,250,255,'+(1-k)+')']]){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();for(const [x,y] of p.pts)ctx.lineTo(x,y);ctx.stroke()}}
    else{ctx.strokeStyle='rgba(255,220,120,'+(1-k)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke()}
  }
  for(const t of tracers){ctx.strokeStyle='rgba(255,230,140,'+(1-t.t/.06)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(t.x1,t.y1);ctx.lineTo(t.x2,t.y2);ctx.stroke()}
  if(beam&&weapon==='laser'&&now-beam.t<.08){
    const m=muzzle();ctx.lineCap='round';
    for(const [lw,c] of [[16,'rgba(255,40,70,.22)'],[7,'rgba(255,70,95,.85)'],[2.5,'#fff']]){ctx.strokeStyle=c;ctx.lineWidth=lw+Math.random()*2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(beam.x,beam.y);ctx.stroke()}
    ctx.fillStyle='rgba(255,200,210,.9)';ell(beam.x,beam.y,8+Math.random()*5,8+Math.random()*5);
  }
}
function crosshair(){
  if(weapon==='fist')return;
  const {x,y}=aim;
  for(const [c,w] of [['#000',5],['#fff',2]]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.moveTo(x-24,y);ctx.lineTo(x-8,y);ctx.moveTo(x+8,y);ctx.lineTo(x+24,y);ctx.moveTo(x,y-24);ctx.lineTo(x,y-8);ctx.moveTo(x,y+8);ctx.lineTo(x,y+24);ctx.stroke()}
  ctx.font='600 13px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
  if(weapon==='nuke'){const t=nukeCD>0?'재장전 '+fmt(nukeCD):'아무 데나 클릭하면 하늘에서 떨어짐';ctx.fillStyle='#000';ctx.fillText(t,x+1,y+33);ctx.fillStyle='#f2c04b';ctx.fillText(t,x,y+32);return}
  if(weapon==='missile'){if(missileCD>0){ctx.fillStyle='#000';ctx.fillText('재장전 '+fmt(missileCD),x+1,y+33);ctx.fillStyle='#f2c04b';ctx.fillText('재장전 '+fmt(missileCD),x,y+32)}return}
  const hv=HEAT,locked=OVER>now;
  if(hv>0.01){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(x-30,y+32,60,6,3);ctx.fill();
    ctx.fillStyle=locked?'#ff4d3d':hv>.7?'#ff8a3d':'#f2f2f2';ctx.beginPath();ctx.roundRect(x-30,y+32,60*hv,6,3);ctx.fill();
    if(locked){ctx.fillStyle='#ff6b4a';ctx.fillText('과열 '+(OVER-now).toFixed(1)+'초',x,y+42)}
  }
}
function hud(){
  const arm=restartArm>now;
  ctx.fillStyle=arm?'rgba(200,40,40,.85)':'rgba(12,13,16,.55)';ctx.beginPath();ctx.roundRect(RB.x,RB.y,RB.w,RB.h,RB.h/2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
  ctx.font='500 15px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(arm?'한 번 더 누르면 초기화':'다시하기',RB.x+RB.w/2,RB.y+RB.h/2+1,RB.w-12);
  ctx.fillStyle='rgba(12,13,16,.55)';ctx.beginPath();ctx.roundRect(CB.x,CB.y,CB.w,CB.h,CB.h/2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.stroke();
  const cg=ctx.createRadialGradient(CB.x+18,CB.y+12,2,CB.x+22,CB.y+18,12);cg.addColorStop(0,'#ffe9a3');cg.addColorStop(1,'#c9921c');ctx.fillStyle=cg;ell(CB.x+22,CB.y+18,10,10);
  ctx.font='700 16px "Noto Sans KR",sans-serif';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(String(coins),CB.x+40,CB.y+19);
  ctx.font='500 13px "Noto Sans KR",sans-serif';ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('상점 ›',CB.x+CB.w-14,CB.y+19);
  if(dead){
    const k=Math.min(1,(now-deathAt)*4);ctx.save();ctx.translate(W/2,H/2-40);ctx.scale(.5+k*.5,.5+k*.5);
    ctx.font='110px "Black Han Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=12;ctx.strokeStyle='#000';
    ctx.strokeText('K.O.',0,0);ctx.fillStyle='#ff3b3b';ctx.fillText('K.O.',0,0);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='500 13px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(DUMMY_NAME+' 부활까지 '+Math.max(0,RESPAWN-deadT).toFixed(1)+'초',W/2,30);
  }
  if(combo>=2){
    ctx.textAlign='left';ctx.textBaseline='top';ctx.font='36px "Black Han Sans",sans-serif';ctx.lineWidth=5;ctx.strokeStyle='#000';
    const t=combo+' COMBO';ctx.strokeText(t,24,H-110);ctx.fillStyle=combo>=12?'#ff5c5c':'#ffd23f';ctx.fillText(t,24,H-110);
  }
}
function effects(){
  for(const r of rings){const k=r.t/.3;ctx.strokeStyle=`rgba(255,255,255,${1-k})`;ctx.lineWidth=5*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,12+k*(30+r.p),0,Math.PI*2);ctx.stroke()}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/.8);ctx.font='26px "Black Han Sans",sans-serif';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(p.s,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.s,p.x,p.y);ctx.globalAlpha=1}
  if(bubble&&!dead){
    const h=rag?{x:rag.p.head.x,y:rag.p.head.y-40}:toScreen({x:40,y:-345});const x=h.x+30,y=h.y-20;
    ctx.font='700 18px "Noto Sans KR",sans-serif';const w=ctx.measureText(bubble.s).width+28;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(x,y-20,w,40,18);ctx.fill();
    ctx.beginPath();ctx.moveTo(x+12,y+14);ctx.lineTo(x-6,y+28);ctx.lineTo(x+26,y+18);ctx.fill();
    ctx.fillStyle='#111';ctx.textAlign='left';ctx.fillText(bubble.s,x+14,y+1);
  }
}
function draw(){
  ctx.save();if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  scene();dummy();for(const m of missiles)missileDraw(m);for(const n of nukes)nukeDraw(n);fxDraw();effects();
  if(weapon==='fist'){glove(gl.L);glove(gl.R)}else weaponSprite();
  ctx.restore();vignette();if(whiteA>0){ctx.fillStyle='rgba(255,250,235,'+Math.min(1,whiteA*1.3)+')';ctx.fillRect(0,0,W,H)}crosshair();hud();
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---- input ---- */
const KEYS={KeyJ:'jab',KeyK:'straight',KeyH:'hook',KeyU:'upper',KeyB:'body'},WKEYS={Digit1:'fist',Digit2:'gun',Digit3:'shotgun',Digit4:'smg',Digit5:'laser',Digit6:'tesla',Digit7:'missile',Digit8:'nuke'};
const shopEl=document.getElementById('shop');
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(!shopEl.hidden&&e.code!=='KeyS'&&e.code!=='Escape')return;
  if(KEYS[e.code]){punch(KEYS[e.code]);e.preventDefault()}
  else if(WKEYS[e.code]){setWeapon(WKEYS[e.code]);e.preventDefault()}
  else if(e.code==='KeyF'&&weapon!=='fist'){if(GUNS[weapon].auto)firing=true;fire(aim.x,aim.y);e.preventDefault()}
  else if(e.code==='KeyS'){shopEl.hidden?openShop():closeShop();e.preventDefault()}
  else if(e.code==='Escape')closeShop();
});
addEventListener('keyup',e=>{if(e.code==='KeyF')firing=false});
document.querySelectorAll('#moves button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();punch(b.dataset.m)});
  b.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();punch(b.dataset.m)}});
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.querySelectorAll('#wpn [data-w]').forEach(b=>b.addEventListener('click',()=>{audio();setWeapon(b.dataset.w)}));
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
const RB={x:16,y:16,w:150,h:36},CB={x:16,y:60,w:150,h:36};
const inBox=(q,B)=>q.x>=B.x&&q.x<=B.x+B.w&&q.y>=B.y&&q.y<=B.y+B.h;
cv.addEventListener('pointerdown',e=>{
  const q=cpos(e);
  if(inBox(q,RB)){if(restartArm>now)restartAll();else restartArm=now+2.5;return}
  if(inBox(q,CB)){openShop();return}
  aim=q;try{cv.setPointerCapture(e.pointerId)}catch(err){}
  if(weapon==='fist')clickPunch(aim.x,aim.y);
  else{if(GUNS[weapon].auto)firing=true;fire(aim.x,aim.y)}
});
cv.addEventListener('pointermove',e=>{aim=cpos(e)});
for(const ev of['pointerup','pointercancel'])cv.addEventListener(ev,()=>{firing=false});
function restartAll(){
  restartArm=0;coins=0;coinAcc=0;gunHits=0;missileCD=0;nukeCD=0;nukes=[];for(const k of ORDER)lv[k]=0;HEAT=0;OVER=0;save();
  pieces=[];rag=null;shades=[];fx=[];missiles=[];tracers=[];combo=0;dead=false;rest=0;a=0;va=0;BX=HOME;stag=0;
  setWeapon('fist');renderWeapons();
}
const fmt=t=>{t=Math.ceil(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function renderWeapons(){
  for(const w of ORDER){
    document.querySelector('[data-w="'+w+'"]').classList.toggle('lock',!lv[w]);
    document.getElementById('s-'+w).textContent=w==='missile'&&missileCD>0?fmt(missileCD):w==='nuke'?(nukeCD>0?fmt(nukeCD):'준비'):'Lv'+lv[w];
  }
  if(!shopEl.hidden)renderShop();
}
function renderShop(){
  document.getElementById('shopcoins').textContent='보유 코인 '+coins;
  document.getElementById('items').innerHTML=ORDER.map(k=>{
    const it=SHOP[k],l=lv[k],G=GUNS[k],mul=1+Math.max(0,l-1)*UP_DMG;
    const info=k==='nuke'?'쿨타임 '+NUKE_CD+'초':k==='missile'?'쿨타임 '+(MISSILE_CD-Math.max(0,l-1)*MISSILE_CD_STEP)+'초':'데미지 '+Math.round(G.pow[0]*mul)+'~'+Math.round(G.pow[1]*mul)+(G.pellets?' × '+G.pellets+'발':'');
    const cost=l?it.up*l:it.buy,label=!l?'구매 '+cost.toLocaleString():it.max===1?'보유':l>=it.max?'최대':'강화 '+cost;
    return '<div class="item"><div><b>'+it.name+(l?' Lv'+l:'')+'</b><small>'+info+' · '+it.desc+'</small></div><button data-buy="'+k+'"'+(l>=it.max||coins<cost?' disabled':'')+'>'+label+'</button></div>';
  }).join('');
}
function openShop(){firing=false;renderShop();shopEl.hidden=false}
function closeShop(){shopEl.hidden=true}
document.getElementById('items').addEventListener('click',e=>{
  const k=e.target.closest('[data-buy]')?.dataset.buy;if(!k)return;
  const it=SHOP[k],l=lv[k],cost=l?it.up*l:it.buy;
  if(l>=it.max||coins<cost)return;
  coins-=cost;lv[k]=l+1;save();renderShop();renderWeapons();
  if(!l)setWeapon(k);
});
document.getElementById('shopclose').addEventListener('click',closeShop);
shopEl.addEventListener('click',e=>{if(e.target===shopEl)closeShop()});
renderWeapons();
const sb=document.getElementById('snd');
sb.addEventListener('click',()=>{sound=!sound;sb.textContent=sound?'소리 켬':'소리 끔';if(!sound)humOff();audio()});
}
</script>
</body>
</html>
